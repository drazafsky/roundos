name: Collect review closeout

on:
  issues:
    types: [closed]
  # Use trusted main code even when the merged PR originated in a fork.
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      issue:
        description: Closed issue number to reconcile
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  discover:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged
    runs-on: ubuntu-24.04
    outputs:
      prs: ${{ steps.links.outputs.prs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: links
        env:
          MERGED_PR: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$MERGED_PR" ]; then
            prs="[$MERGED_PR]"
          else
            prs=$(python3 scripts/ci/review_feedback.py closing-prs "$ISSUE_NUMBER")
          fi
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  record:
    needs: discover
    if: needs.discover.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    concurrency:
      group: review-closeout-pr-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - env:
          PR_NUMBER: ${{ matrix.pr }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/review_feedback.py evidence "$PR_NUMBER" --record > "$RUNNER_TEMP/review-evidence.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v8.0.2
        with:
          name: review-evidence-${{ matrix.pr }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-evidence.json
          if-no-files-found: error
