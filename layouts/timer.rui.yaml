schema: roundos.rui/v1
application:
  id: org.roundos.timer
  icon: TMR
screens:
  - id: timer.root
    title: TIMER
    layout: hero_list
    hero: { bind: timer.display }
    subtitle: { bind: timer.status }
    groups:
      - id: controls
        widgets:
          - id: timer.toggle
            type: button
            label: { bind: timer.toggleLabel }
            variant: primary
            onPress: toggle
          - id: timer.duration.link
            type: button
            label: DURATION
            navigate: timer.duration
  - id: timer.duration
    title: DURATION
    layout: list
    subtitle: STOP TIMER TO EDIT
    groups:
      - id: controls
        widgets:
          - id: timer.minutes
            type: slider
            label: MINUTES
            value: { bind: timer.minutes }
            min: 0
            max: 999
            step: 1
            enabledWhen: { bind: timer.stopped }
            onCommit: set_minutes
          - id: timer.picker
            type: numberPicker
            label: SET MINUTES
            value: { bind: timer.minutes }
            min: 0
            max: 999
            step: 1
            enabledWhen: { bind: timer.stopped }
            onCommit: set_minutes
          - id: timer.reset
            type: button
            label: RESET TIMER
            onPress: request_reset
          - id: timer.progress
            type: progress
            label: TIME REMAINING
            value: { bind: timer.minutes }
            min: 0
            max: 999
dialogs:
  - id: timer-reset
    title: RESET TIMER?
    body: THIS WILL DISCARD TIME
    confirmLabel: CONFIRM
    cancelLabel: CANCEL
    onConfirm: confirm_reset
    onCancel: cancel_reset
    destructive: true
